              </div>

              <!-- Dual Perspective -->
              <div style="margin-top: 1.5rem;">
                <div class="tree-node-label">Dual Perspective 双方视角</div>
                <div class="dual-perspective">
                  <div class="perspective-side a">
                    <div class="perspective-label">A 方视角</div>
                    <div class="perspective-text">
                      <strong>事实：</strong>${data.aFact}<br>
                      <strong>情绪：</strong>${data.aEmotion}<br>
                      <strong>需求：</strong>${data.aNeed}
                    </div>
                  </div>
                  <div class="perspective-side b">
                    <div class="perspective-label">B 方视角</div>
                    <div class="perspective-text">
                      <strong>事实：</strong>${data.bFact}<br>
                      <strong>情绪：</strong>${data.bEmotion}<br>
                      <strong>需求：</strong>${data.bNeed}
                    </div>
                  </div>
                </div>
              </div>

              <!-- Common ground -->
              <div class="insight-box" style="background: rgba(126,167,255,0.04);">
                <div class="insight-label">Common Ground 共同点</div>
                <div class="insight-text">
                  <strong>共同需求：</strong>${data.commonNeed}<br>
                  <strong>共同误解：</strong>${data.commonMisread}
                </div>
              </div>

              <!-- Suggestion -->
              <div style="margin-top: 1rem; padding: 1rem; border-radius: 12px; background: rgba(126,167,255,0.06); border: 1px solid rgba(126,167,255,0.12);">
                <div class="tree-node-label">Suggestion 建议</div>
                <div class="tree-node-text" style="color: var(--ink);">${data.suggest}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleCard(header) {
      var card = header.parentElement;
      card.classList.toggle('open');
    }

    // Render all scenarios
    var grid = document.getElementById('scenarioGrid');
    for (var key in SCENARIOS) {
      grid.innerHTML += createScenarioCard(key, SCENARIOS[key]);
    }
  </script>
</body>
</html>
