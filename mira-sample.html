<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRA 4张样本对比</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #08090B;
    color: #E8EAED;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 40px 20px;
  }
  h1 { text-align:center; font-size:1.5rem; font-weight:300; letter-spacing:6px; margin-bottom:30px; color:#D4AF37; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.3s, border-color 0.3s;
  }
  .card:hover { transform:translateY(-4px); border-color:rgba(212,175,55,0.25); }
  .card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
  }
  .info { padding: 16px 20px; }
  .code { font-size:1.6rem; font-weight:200; letter-spacing:6px; background:linear-gradient(135deg,#A8B2D1,#D4AF37); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .name { font-size:0.95rem; color:#D4AF37; margin:4px 0 8px; }
  .desc { font-size:0.78rem; color:#8A92A0; line-height:1.6; }
</style>
</head>
<body>
<h1>M I R A · 样本预览</h1>
<div class="grid">
  <div class="card">
    <img src="mira-images/DO.jpg" alt="DO">
    <div class="info">
      <div class="code">D O</div>
      <div class="name">无声的守望者</div>
      <div class="desc">深沉内敛 + 全然向对方</div>
    </div>
  </div>
  <div class="card">
    <img src="mira-images/ST.jpg" alt="ST">
    <div class="info">
      <div class="code">S T</div>
      <div class="name">灵动的镜映者</div>
      <div class="desc">倾听为主 + 偏向双方</div>
    </div>
  </div>
  <div class="card">
    <img src="mira-images/BO.jpg" alt="BO">
    <div class="info">
      <div class="code">B O</div>
      <div class="name">热忱的守护者</div>
      <div class="desc">表达为主 + 全然向对方</div>
    </div>
  </div>
  <div class="card">
    <img src="mira-images/RO.jpg" alt="RO">
    <div class="info">
      <div class="code">R O</div>
      <div class="name">炽热的追随者</div>
      <div class="desc">坦率直白 + 全然向对方</div>
    </div>
  </div>
</div>
</body>
</html>
